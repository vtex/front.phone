sonar.projectKey=front.phone
sonar.projectName=front.phone
sonar.projectVersion=4.21.0

# Source code is CoffeeScript under src/script/, but Sonar can only analyse the
# compiled JavaScript (the community CoffeeScript plugin is end-of-life). The
# `yarn test:coverage` script compiles src/script/**/*.coffee -> .js alongside
# the source and produces coverage/lcov.info pointing at those .js files.
sonar.sources=src/script
sonar.tests=spec
sonar.sourceEncoding=UTF-8
sonar.inclusions=src/script/**/*.js
sonar.test.inclusions=spec/**/*-spec.coffee,**/*.test.*,**/*.spec.*,**/__tests__/**

sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/bin/**,**/obj/**,**/*.generated.*,**/coverage/**,src/script/main.js

# Coverage — produced by `yarn test:coverage` (nyc + Istanbul, lcov format).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=spec/**,**/*-spec.coffee,Gruntfile.coffee,src/script/main.js

# `src/script/**/*.js` is gitignored (the .coffee source is the canonical form;
# .js is regenerated by `yarn coverage:build` before each scan). Without this
# flag the dkcicd sonar-scanner's SCM integration drops every compiled .js as
# "not versioned", which makes the LCOV importer unable to resolve
# `SF:src/script/...js` entries and leaves coverage at "Not computed".
sonar.scm.exclusions.disabled=true

# Issue suppressions for the compiled JavaScript. The CoffeeScript 1.x
# compiler always emits ES5 with `var` declarations and IIFE wrappers, so
# rules that flag those would produce thousands of non-actionable issues —
# the canonical fix would be to rewrite the source in modern JS, not to add
# `let`/`const` to generated output.
sonar.issue.ignore.multicriteria=legacyVar,generatedJs
sonar.issue.ignore.multicriteria.legacyVar.ruleKey=javascript:S3504
sonar.issue.ignore.multicriteria.legacyVar.resourceKey=src/script/**/*.js
sonar.issue.ignore.multicriteria.generatedJs.ruleKey=javascript:S3358
sonar.issue.ignore.multicriteria.generatedJs.resourceKey=src/script/**/*.js
