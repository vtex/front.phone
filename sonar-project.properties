sonar.projectKey=front.phone
sonar.projectName=front.phone
sonar.projectVersion=4.21.0

# We compile CoffeeScript to JavaScript before running coverage so SonarQube's
# JavaScript analyzer can index the sources. Run `yarn test:coverage` before
# `sonar-scanner` so the .js files in src/script exist when the analyzer runs.
sonar.sources=src/script
sonar.tests=spec
sonar.sourceEncoding=UTF-8
sonar.inclusions=src/script/**/*.js
sonar.test.inclusions=spec/**/*-spec.coffee,**/*.test.*,**/*.spec.*,**/__tests__/**

sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/bin/**,**/obj/**,**/*.generated.*,**/coverage/**,src/script/main.js

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=spec/**,**/*-spec.coffee,Gruntfile.coffee,src/script/main.js
