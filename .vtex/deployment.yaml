- build:
    pipelines:
    - name: node-ci-v2
      notifications:
        slack:
          channel: checkout-ui-notifications
      parameters:
        packageManager: npm
        sonarProjectName: front.phone
        nodeCommands:
            - run build
            - test
      runtime:
        architecture: amd64
      when:
      - event: pull_request
        source: branch
      - event: push
        source: branch
        regex: main
    - name: build-node-app-and-upload-artifacts-v1
      notifications:
        slack:
          channel: checkout-ui-notifications
      parameters:
        awsAccountId: "053131491888"
        awsBucket: vtex-io-us
        awsRegion: us-east-1
        build: "true"
        destinationPath: front.phone
        appVersion: "{{ ref_name }}"
        packageManager: npm
      runtime:
        architecture: amd64
      when:
      - event: push
        source: tag
    - name: techdocs-v1
      parameters:
        entityReference: default/component/front.phone
      when:
      - event: push
        source: branch
        regex: main
        path:
        - "docs/**"
        - ".vtex/deployment.yaml"
        - ".vtex/deployment.json"
        - "README.md"
    provider: dkcicd
  description: front.phone is a Javascript library that identifies, validates and
    formats phone numbers
  name: front.phone
  referenceId: 4HISK5KU
